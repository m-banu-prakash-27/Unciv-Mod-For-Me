name: Magalanadu ruleset validation (Unciv 4.22.18-patch1)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependency
        run: python -m pip install Pillow
      - name: Validate v3.0 ruleset, worker resource generators, removed units and atlas assets
        run: python tests/validate_v3_0.py
      - name: Check updated promotions and gifting rules
        run: python tests/validate_v3_2_gifts_promotions.py
      - name: Check v3.1 export rewards
        run: python tests/validate_v3_1_exports.py
      - name: Check v4.0 Strategic Directorate engine patch and economic contracts
        run: python tests/validate_v4_directorate.py
      - name: Check inherited v4.1 patch prerequisites (v4.2 replaces 108 radius)
        run: python tests/validate_v4_1_radius.py
      - name: Check v4.2 radius-14 and 60-40 territory controls
        run: python tests/validate_v4_2_territory.py
      - name: Validate live terraforming editor source and hooks
        run: python tests/validate_v4_3_terraforming.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run official Unciv 4.22.18-patch1 mod-ci validator
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o Unciv.jar \
            https://github.com/yairm210/Unciv/releases/download/4.22.18-patch1/Unciv.jar
          java -jar Unciv.jar mod-ci
