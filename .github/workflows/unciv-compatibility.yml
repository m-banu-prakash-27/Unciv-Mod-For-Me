name: Magalanadu v4.0 validation (Unciv 4.22.16)
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependency
        run: python -m pip install Pillow
      - name: Validate v3.0 ruleset, worker resource generators, removed units and atlas assets
        run: python tests/validate_v3_0.py
      - name: Check updated promotions and gifting rules
        run: python tests/validate_v3_2_gifts_promotions.py
      - name: Check v3.1 export rewards
        run: python tests/validate_v3_1_exports.py
      - name: Check v4.0 Strategic Directorate engine patch and economic contracts
        run: python tests/validate_v4_directorate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run official Unciv 4.22.16 mod-ci validator
        run: |
          curl --fail --location --retry 3 --silent --show-error \
            -o Unciv.jar \
            https://github.com/yairm210/Unciv/releases/download/4.22.16/Unciv.jar
          java -jar Unciv.jar mod-ci
